  postgres:
    image: postgres:latest
    networks:
      - elt_network
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    
  init-airflow:
    image: apache/airflow:latest
    depends_on:
      - postgres
    networks:
      - elt_network
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgres+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__API_AUTH__JWT_SECRET=my-shared-jwt-secret-change-me
    command: >
      bash -c "airflow db migrate && airflow users create --username airflow --password password --firstname Lina --lastname Raoui --role Admin --email linaraoui@gmail.com"

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    networks:
      - elt_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./elt:/opt/airflow/elt
      - ./logs:/opt/airflow/logs
      - ./hr_elt:/opt/dbt
      - ~/.dbt:/root/.dbt
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOAD_EX=n
      - EXECUTOR=local
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://airflow:airflow@postgres/airflow
      - AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=airflow
      - AIRFLOW__WEBSERVER__DEFAULT__USER_PASSWORD=password
      - AIRFLOW__WWW_USERNAME=airflow
      - AIRFLOW__WWW_USER_PASSWORD=password
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__API_AUTH__JWT_SECRET=my-shared-jwt-secret-change-me
    ports:
      - "8080:8080"
    command: ["airflow", "api-server"]

  scheduler:
      build:
        context: .
        dockerfile: Dockerfile
      depends_on:
        - postgres
      networks:
        - elt_network
      extra_hosts:
        - "host.docker.internal:host-gateway"
      volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./elt:/opt/airflow/elt
        - ./logs:/opt/airflow/logs
        - ./hr_elt:/opt/dbt
        - ~/.dbt:/root/.dbt
        - /var/run/docker.sock:/var/run/docker.sock
      environment:
        - LOAD_EX=n
        - EXECUTOR=local
        - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://airflow:airflow@postgres/airflow
        - AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=airflow
        - AIRFLOW__WEBSERVER__DEFAULT__USER_PASSWORD=password
        - AIRFLOW__WWW_USERNAME=airflow
        - AIRFLOW__WWW_USER_PASSWORD=password
        - AIRFLOW__WEBSERVER__SECRET_KEY=secret
        - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://webserver:8080/execution/
        - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-${PWD}}
        - HOST_DBT_PROFILES_DIR=${HOST_DBT_PROFILES_DIR:-${HOME}/.dbt}
        - AIRFLOW__API_AUTH__JWT_SECRET=my-shared-jwt-secret-change-me
      command: scheduler

  dag-processor:
      build:
        context: .
        dockerfile: Dockerfile
      depends_on:
        - postgres
      networks:
        - elt_network
      extra_hosts:
        - "host.docker.internal:host-gateway"
      volumes:
        # IMPORTANT: Make sure this path exactly matches what you used for your webserver and scheduler!
        - ./airflow/dags:/opt/airflow/dags
        - ./logs:/opt/airflow/logs
        - ./elt:/opt/airflow/elt
        - ./hr_elt:/opt/dbt
        - ~/.dbt:/root/.dbt
        - /var/run/docker.sock:/var/run/docker.sock
      environment:
        - LOAD_EX=n
        - EXECUTOR=local
        - AIRFLOW__API_AUTH__JWT_SECRET=my-shared-jwt-secret-change-me
        - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://airflow:airflow@postgres/airflow
        - AIRFLOW__WEBSERVER__SECRET_KEY=secret
        - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://webserver:8080/execution/
      command: dag-processor
     






networks:
  elt_network:
    name: elt_network
    driver: bridge